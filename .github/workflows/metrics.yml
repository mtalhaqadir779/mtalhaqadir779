name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Karachi

          # Overall stats sections
          base: header, activity, community, repositories, metadata
          base_indepth: yes

          # Include private, collaborator, and org repos
          repositories_affiliations: owner, collaborator, organization_member

          # Commits made under other identities (work email etc.)
          commits_authoring: mtalhaqadir779, m.talha.qadir779@gmail.com

          # Languages
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_analysis_timeout: 30

          # Extra stats
          plugin_lines: yes
          plugin_habits: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
